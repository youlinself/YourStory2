    <style id="theme-vars">
@import "tailwindcss";

@theme {
  --color-brand: #da7756;
  --color-brand-hover: #c4684a;
  --color-brand-light: rgba(218, 119, 86, 0.1);
  --color-brand-surface: rgba(218, 119, 86, 0.06);
  
  --color-gold: #c9a96e;
  --color-gold-light: rgba(201, 169, 110, 0.12);
  --color-sage: #7a9e7e;
  --color-sage-light: rgba(122, 158, 126, 0.12);
  
  --color-ink: #1a1a1a;
  --color-ink-secondary: #4a4a4a;
  --color-ink-tertiary: #6b6b6b;
  --color-ink-muted: #8a8a8a;
  --color-ink-faint: #b0b0b0;
  
  --color-bg: #faf8f5;
  --color-bg-elevated: #ffffff;
  --color-bg-subtle: #f5f0eb;
  --color-bg-hover: rgba(0, 0, 0, 0.02);
  
  --color-border: rgba(0, 0, 0, 0.1);
  --color-border-subtle: rgba(0, 0, 0, 0.06);
  --color-border-emphasis: rgba(0, 0, 0, 0.15);
  
  --color-success: #2d9d4e;
  --color-success-bg: rgba(45, 157, 78, 0.1);
  --color-warning: #e5a100;
  --color-warning-bg: rgba(229, 161, 0, 0.1);
  --color-danger: #d1242f;
  --color-danger-bg: rgba(209, 36, 47, 0.1);
  
  --font-serif: "Noto Serif SC", Georgia, serif;
  --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
  
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08);
  
  --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
}

:root {
  --background: #faf8f5;
  --foreground: #1a1a1a;
  --card: #ffffff;
  --card-foreground: #1a1a1a;
  --popover: #ffffff;
  --popover-foreground: #1a1a1a;
  --primary: #da7756;
  --primary-foreground: #ffffff;
  --secondary: #f5f0eb;
  --secondary-foreground: #1a1a1a;
  --muted: #f5f0eb;
  --muted-foreground: #8a8a8a;
  --accent: rgba(218, 119, 86, 0.06);
  --accent-foreground: #1a1a1a;
  --border: rgba(0, 0, 0, 0.1);
  --input: rgba(0, 0, 0, 0.1);
  --ring: rgba(218, 119, 86, 0.2);
  --radius-small: 6px;
  --radius-medium: 10px;
  --radius-large: 14px;
}

.text-serif { font-family: var(--font-serif); }
.text-sans { font-family: var(--font-sans); }

body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-ink);
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.15); }

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in { animation: fadeIn 0.35s var(--ease-out); }
.animate-slide-up { animation: slideUp 0.4s var(--ease-out); }

/* Button */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  font-size: 0.875rem;
  font-weight: 500;
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--color-brand);
  color: white;
  box-shadow: 0 1px 2px rgba(218, 119, 86, 0.15);
}
.btn-primary:hover { background: var(--color-brand-hover); box-shadow: var(--shadow-md); }
.btn-ghost {
  background: transparent;
  color: var(--color-ink-tertiary);
}
.btn-ghost:hover { background: var(--color-bg-hover); color: var(--color-ink); }

/* Input */
.input {
  width: 100%;
  padding: 0.625rem 0.875rem;
  font-size: 0.875rem;
  color: var(--color-ink);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  outline: none;
  transition: all 0.15s var(--ease-out);
}
.input:hover { border-color: var(--color-border-emphasis); }
.input:focus { border-color: var(--color-brand); box-shadow: 0 0 0 3px var(--color-brand-light); }
.input::placeholder { color: var(--color-ink-faint); }

/* Tab */
.tab {
  padding: 0.5rem 0;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--color-ink-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
}
.tab:hover { color: var(--color-ink); }
.tab.active { color: var(--color-brand); border-bottom-color: var(--color-brand); }

/* Card */
.card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.2rem 0.6rem;
  font-size: 0.75rem;
  font-weight: 500;
  border-radius: var(--radius-full);
  line-height: 1.4;
}

/* Nav Link */
.nav-link {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  color: var(--color-ink-muted);
  transition: all 0.15s var(--ease-out);
  cursor: pointer;
}
.nav-link:hover { background: var(--color-bg-hover); color: var(--color-ink); }
.nav-link.active { background: var(--color-brand-surface); color: var(--color-brand); font-weight: 500; }
.nav-link svg { width: 18px; height: 18px; stroke-width: 1.5; }

/* Progress Bar */
.progress-track {
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--color-bg-subtle);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--color-brand);
  transition: width 0.4s var(--ease-out);
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: var(--color-bg-elevated);
  border-right: 1px solid var(--color-border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/* Main content area */
.main-area {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Content panel */
.content-panel {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem 2rem;
}

/* Right panel */
.right-panel {
  width: 260px;
  background: var(--color-bg-elevated);
  border-left: 1px solid var(--color-border-subtle);
  overflow-y: auto;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* Section heading */
.section-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 600;
  color: var(--color-ink);
}

/* Stat item */
.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.625rem 0;
}
.stat-row + .stat-row { border-top: 1px solid var(--color-border-subtle); }

/* Activity item */
.activity-item {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 0.5rem 0;
}

/* Quick action */
.quick-action {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.625rem 0.75rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-subtle);
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
}
.quick-action:hover { border-color: var(--color-brand); background: var(--color-brand-surface); }
.quick-action:hover svg { color: var(--color-brand); }
.quick-action:hover span { color: var(--color-brand); }

/* Chapter card */
.chapter-card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  transition: all 0.15s var(--ease-out);
}
.chapter-card:hover { box-shadow: var(--shadow-md); border-color: var(--color-border); }

/* Chat bubble */
.chat-bubble {
  padding: 0.75rem 1rem;
  max-width: 80%;
  word-wrap: break-word;
  font-size: 0.9375rem;
  line-height: 1.65;
}
.chat-bubble-user {
  background: var(--color-bg-subtle);
  border-radius: var(--radius-xl) var(--radius-xl) 4px var(--radius-xl);
  margin-left: auto;
}
.chat-bubble-ai {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-subtle);
  border-radius: 4px var(--radius-xl) var(--radius-xl) var(--radius-xl);
  font-family: var(--font-serif);
  line-height: 1.75;
}

/* Avatar */
.avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 0.875rem;
}

/* Loading dots */
.dot {
  width: 5px;
  height: 5px;
  border-radius: var(--radius-full);
  background: var(--color-ink-muted);
  animation: pulse 1.4s infinite ease-in-out;
}
.dot:nth-child(1) { animation-delay: 0s; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.75); }
  40% { opacity: 1; transform: scale(1); }
}

/* Suggestion chip */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 0.375rem 0.75rem;
  font-size: 0.8125rem;
  color: var(--color-ink-tertiary);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
}
.chip:hover { border-color: var(--color-brand); color: var(--color-brand); background: var(--color-brand-surface); }

/* Header */
.app-header {
  height: 56px;
  background: var(--color-bg-elevated);
  border-bottom: 1px solid var(--color-border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  flex-shrink: 0;
}

/* Timeline indicator */
.timeline-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}

/* Tooltip */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  padding: 0.25rem 0.5rem;
  background: var(--color-ink);
  color: white;
  font-size: 0.75rem;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  pointer-events: none;
}

/* Focus visible */
:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }

/* Selection */
::selection { background: var(--color-brand-light); }
